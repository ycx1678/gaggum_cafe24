<!-- 대량견적 요청 모달 (교차①). 백오피스 /api/quote-requests 로 구조화 전송.
     setting_banner.js 등 jQuery 1.12.4(noConflict) 비의존 — bulk_quote.js 는 vanilla IIFE. -->
<!--@css(/nd/css/bulk_quote_v200.css)-->
<div id="ndBulkQuote" class="ndBq" aria-hidden="true">
  <div class="ndBq_dim" data-bq-close></div>
  <div class="ndBq_panel" role="dialog" aria-modal="true" aria-labelledby="ndBqTitle">
    <button type="button" class="ndBq_x" data-bq-close aria-label="닫기">×</button>
    <h2 id="ndBqTitle" class="ndBq_title">대량견적 요청</h2>
    <p class="ndBq_desc">대량 구매 견적을 요청하시면 담당자가 확인 후 견적서를 보내드립니다.</p>

    <form id="ndBqForm" class="ndBq_form" novalidate>
      <div class="ndBq_field">
        <label for="ndBqCompany">회사 / 기관명</label>
        <input id="ndBqCompany" name="companyName" type="text" autocomplete="organization">
      </div>
      <div id="ndBqMemberNotice" class="ndBq_memberNotice" hidden>
        <strong>현재 로그인 회원 정보와 장바구니 기준으로 견적 요청됩니다.</strong>
        <p id="ndBqProfileStatus">Cafe24 회원정보의 연락처를 불러오는 중입니다. 배송지는 직접 입력해주세요.</p>
        <div id="ndBqCartPreview" class="ndBq_cartPreview"></div>
      </div>
      <div id="ndBqGuestFields" class="ndBq_guestFields">
        <div class="ndBq_row2">
          <div class="ndBq_field">
            <label for="ndBqManager">담당자명 <em>*</em></label>
            <input id="ndBqManager" name="managerName" type="text" autocomplete="name" required>
          </div>
          <div class="ndBq_field">
            <label for="ndBqPhone">연락처 <em>*</em></label>
            <input id="ndBqPhone" name="phone" type="tel" placeholder="010-1234-5678" autocomplete="tel" required>
          </div>
        </div>
        <div class="ndBq_field">
          <label for="ndBqEmail">이메일</label>
          <input id="ndBqEmail" name="email" type="email" autocomplete="email">
        </div>
        <div class="ndBq_row2 ndBq_deliveryRow">
          <div class="ndBq_field">
            <label for="ndBqElevator">엘리베이터 사용가능 유/무 <em>*</em></label>
            <select id="ndBqElevator" name="elevatorAccess" required aria-required="true">
              <option value="">선택해주세요</option>
              <option value="elevator">엘리베이터로 이동 가능</option>
              <option value="stairs">계단으로만 이동 가능</option>
              <option value="mixed">계단 + 엘리베이터</option>
            </select>
          </div>
          <div class="ndBq_field">
            <label for="ndBqPreferredDeliveryDate">배송 희망일 선택</label>
            <input id="ndBqPreferredDeliveryDate" name="preferredDeliveryDate" type="date">
          </div>
        </div>
        <div class="ndBq_field">
          <label for="ndBqPostcode">주소 <em>*</em></label>
          <div class="ndBq_addressSearch">
            <input id="ndBqPostcode" name="postcode" type="text" placeholder="우편번호" autocomplete="postal-code" readonly required aria-required="true">
            <button type="button" id="ndBqFindAddress">주소검색</button>
          </div>
          <input id="ndBqAddress1" name="address1" type="text" placeholder="기본주소" autocomplete="address-line1" readonly required aria-required="true">
          <input id="ndBqAddress2" class="ndBq_addressLine" name="address2" type="text" placeholder="나머지 주소(선택 입력 가능)" autocomplete="address-line2">
        </div>
      </div>

      <div id="ndBqManualItems" class="ndBq_field">
        <label>견적 받을 품목 <em>*</em></label>
        <div id="ndBqItems" class="ndBq_items"></div>
        <button type="button" id="ndBqAddItem" class="ndBq_addItem">품목 추가</button>
      </div>

      <div class="ndBq_field">
        <label for="ndBqMemo">요청사항</label>
        <textarea id="ndBqMemo" name="memo" rows="5" placeholder="견적요청 및 배송 시 특이사항에 대해 가능한 자세히 기재해주세요.&#10;- 엘리베이터 사용하고 한 층은 계단으로 올라가야 합니다.&#10;- 엘리베이터 사용 시 보양을 꼭 해야 해요.&#10;- 상품 조립도 함께 요청하고 싶어요.&#10;- 25년도 12월에 구매했던 가격과 동일하게 구매가 가능할까요?"></textarea>
      </div>

      <!-- honeypot: 사람은 비움. 채워지면 봇으로 보고 무시됨. -->
      <input class="ndBq_hp" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input id="ndBqMemberId" name="memberId" type="hidden">
      <!-- Cafe24 서버 렌더 로그인 신호: 로그인 시에만 이 요소가 존재(module=Layout_statelogon).
           {$id}/{$name}은 HTML 조각으로 렌더될 수 있어 속성에 넣지 않고 textContent로 읽는다. -->
      <span module="Layout_statelogon" class="ndBq_memberState" style="display:none" aria-hidden="true">
        <b id="ndBqStateOn">
          <i id="ndBqMemberIdText">{$id}</i>
          <i id="ndBqMemberNameText">{$name}</i>
        </b>
      </span>

      <button type="submit" id="ndBqSubmit" class="ndBq_submit">견적 요청 보내기</button>
      <p id="ndBqMsg" class="ndBq_msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>
<!-- Cafe24 사용자 JS 합본의 선행 오류가 견적 초기화를 중단하지 않도록 독립 로드한다. -->
<script src="/nd/js/bulk_quote_v200.js?v=20260908v200"></script>
