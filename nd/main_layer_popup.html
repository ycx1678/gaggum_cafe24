<div class="ndLp_wrap">
    <div class="ndLp_dim"></div>

    <button class="ndLp_close">✕</button>

	    <div class="ndLp_cont">
	        <h2 class="ndLp_title">
	            <strong>상단</strong> 타입별 <strong>선택 가능!</strong>
	        </h2>

        <p class="ndLp_sub">
            상단 레이아웃 중 실제 매출 높은 쇼핑몰에서 많이 사용되고 있는 사용성이 검증된 조합만 선별했습니다.
        </p>

        <!-- 헤더 타입 -->
        <div class="ndLp_type_grid">
            <div class="ndLp_type_item">
                <div class="ndLp_img_box"><span class="ndLp_type_label">01. 로고 왼쪽</span><img src="/nd/images/001.jpg"></div>
            </div>

            <div class="ndLp_type_item">
                <div class="ndLp_img_box"><span class="ndLp_type_label">02. 로고 중앙</span><img src="/nd/images/002.jpg"></div>
            </div>

            <div class="ndLp_type_item">
                <div class="ndLp_img_box"><span class="ndLp_type_label">03. 로고 왼쪽 + 상단 투명</span><img src="/nd/images/003.jpg"></div>
            </div>

            <div class="ndLp_type_item">
                <div class="ndLp_img_box"><span class="ndLp_type_label">04. 로고 중앙 + 상단 투명</span><img src="/nd/images/004.jpg"></div>
            </div>
        </div>

        <!-- 띠배너 -->
        <div class="ndLp_banner_section">
            <h3 class="ndLp_banner_title">최상단 띠배너 선택 가능!</h3>

            <div class="ndLp_banner_grid">
                <!-- 상하 롤링 -->
                <div class="ndLp_banner_item">
                    <div class="ndLp_banner_preview ndLp_rolling">
                        <ul>
                            <li class="bg1">무료배송 이벤트 진행중</li>
                            <li class="bg2">신규회원 10% 할인</li>
                            <li class="bg3">오늘출발 상품 안내</li>
                        </ul>
                    </div>
                    <span class="ndLp_banner_label">01. 상하 롤링 타입</span>
                </div>

                <!-- 흐르는 텍스트 -->
                <div class="ndLp_banner_item">
                    <div class="ndLp_banner_preview ndLp_flow">
                        <div class="ndLp_flow_track">
                            <span>신규회원 10% 할인</span>
                            <span>신규회원 10% 할인</span>
                            <span>신규회원 10% 할인</span>
                        </div>
                    </div>
                    <span class="ndLp_banner_label">02. 흐르는 텍스트 타입</span>
                </div>
            </div>
        </div>
    </div>
</div>
