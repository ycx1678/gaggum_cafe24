                $product_page=/product/detail.html

        </div><!--// 인기검색어 end -->

        <div module="search_recentkeyword">
            <ul class="{$recent_list_display|display}">

                <li data-index="{$recent_keyword_index}">
                    <a href="{$recent_keyword_url}">{$recent_keyword_name}</a><i class="xi-close-thin" onclick="{$recent_keyword_remove}" title="삭제"></i>

            <div class="button">
