<!-- ND PROMO POPUP -->
<div class="ndPromoPopup" style="display:none;">
    <div class="ndPromoPopup__dim"></div>

    <div class="ndPromoPopup__wrap">

        <!-- 슬라이드 영역 -->
        <div class="ndPromoPopup__slider">
            <div class="ndPromoPopup__slide is-active"><img src="/web/awesome_img/popup_01.jpg" alt=""></div>
            <div class="ndPromoPopup__slide"><img src="/web/awesome_img/popup_02.jpg" alt=""></div>
            <div class="ndPromoPopup__slide"><img src="/web/awesome_img/popup_03.jpg" alt=""></div>

            <!-- ✅ 페이징 도트 (이미지 위로 이동) -->
            <div class="ndPromoPopup__dots">
                <span class="ndPromoPopup__dot is-active"></span>
                <span class="ndPromoPopup__dot"></span>
                <span class="ndPromoPopup__dot"></span>
            </div>
            <button type="button" class="ndPromoPopup__arrow ndPromoPopup__arrow--prev">‹</button>
            <button type="button" class="ndPromoPopup__arrow ndPromoPopup__arrow--next">›</button>
        </div>

        <!-- 버튼 -->
        <div class="ndPromoPopup__btns">
            <button type="button" class="ndPromoPopup__btn ndPromoPopup__btn--today">
                하루 동안 보지 않기
            </button>
            <button type="button" class="ndPromoPopup__btn ndPromoPopup__btn--close">
                닫기
            </button>
        </div>

    </div>
</div>
